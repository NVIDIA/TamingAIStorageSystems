# =============================================================================
# exascaler-annotated.conf
# A READING copy of a small EXAScaler/Lustre filesystem definition.
# You will not run this. Read the comments: understand what is decided at
# FORMAT time (permanent) vs what is TUNABLE live (change any day).
# Filesystem name: "ai0"   |   40 OSTs across 5 OSS   |   2 MDTs across 2 MDS
# =============================================================================

# ---- FORMAT-TIME (baked in when the target is created; hard to change) ------
[filesystem]
name            = ai0
mdt_count       = 2          # metadata targets  -> METADATA PLANE (DNE)
ost_count       = 40         # object targets    -> DATA PLANE
                             # ^ the number of OSTs is your ceiling on stripe_count

[mdt.features]               # enabled with mkfs.lustre / tunefs at format time
ea_inode        = on         # required for wide striping (>2000 refs) and DoM
dne             = on         # Distributed Namespace: metadata across many MDTs
dom             = enabled    # allow Data-on-MDT components (tiny-file tail)

[ost.backing]
raid            = 8+2        # per-OST protection; this is your blast-radius floor
sector         = 4096        # 4K native; do not mismatch with the app

# ---- LIVE-TUNABLE (change per-directory or per-file, any time) --------------
# These are DEFAULTS the filesystem hands out. Users override per path.
[defaults.striping]
stripe_count    = 1          # <-- THE TRAP. One file -> one OST -> one server.
stripe_size     = 1048576    # 1 MiB. Range 64 KiB .. 4 GiB. Sane band: 1-4 MiB.
stripe_offset   = -1         # -1 = let the MDS pick the starting OST (do this)
pool            = (none)     # no pool = any OST is eligible

[defaults.metadata]
statahead_max   = 32         # readahead depth for directory scans / mass opens
dir_stripe      = 1          # striped directories (DNE phase 2) off by default

# -----------------------------------------------------------------------------
# WHAT TO NOTICE
#   * ost_count (40) caps stripe_count. "-1" means "all 40".
#   * stripe_count default of 1 is why a fresh filesystem underperforms:
#     a 40-OST system hands out single-OST files unless you tell it otherwise.
#   * stripe_size, pools, PFL, quotas: all live-tunable. You do NOT reformat
#     to fix striping -- you change policy and re-write the data.
# =============================================================================
